<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zamtech Sdn Bhd provides construction, engineering, industrial supply and project support services in Sabah, Malaysia.">
  <title>Zamtech Sdn Bhd | Engineering & Industrial Supply</title>
  <link rel="icon" type="image/png" href="zamtech-logo.png">
  <style>
    :root { --ink:#102a38; --navy:#092432; --teal:#08a7aa; --aqua:#bdf4ef; --sand:#e8ebe8; --white:#fff; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:1.55; background:#f8faf9; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(1140px, calc(100% - 40px)); margin:auto; }
    nav { background:#e9f1ff; color:#0d3d92; position:sticky; top:0; z-index:2; border-bottom:1px solid #c8daf7; }
    .nav-inner { min-height:98px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .brand { display:flex; align-items:center; padding:5px 12px; background:#fff; }
    .brand img { display:block; width:128px; height:auto; }
    .nav-links { display:flex; gap:25px; font-size:.88rem; font-weight:700; letter-spacing:.04em; }
    .hero { background:var(--navy); color:#fff; padding:88px 0 96px; overflow:hidden; }
    .hero-grid { display:grid; grid-template-columns:1.45fr .75fr; gap:70px; align-items:end; }
    .eyebrow { margin:0 0 18px; color:var(--teal); font-size:.78rem; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1 { max-width:760px; margin:0; font-size:clamp(3rem,7vw,6.5rem); line-height:.94; letter-spacing:-.06em; }
    .hero-copy { max-width:530px; margin:30px 0 34px; color:#d5e1e3; font-size:1.15rem; }
    .button { display:inline-block; padding:14px 21px; background:var(--teal); color:#08232f; font-weight:800; border:2px solid var(--teal); }
    .button:hover { background:#fff; border-color:#fff; }
    .hero-panel { border-left:2px solid var(--teal); padding:6px 0 5px 24px; }
    .hero-panel p { margin:0 0 8px; color:#c3d1d5; }
    .hero-panel strong { display:block; font-size:2rem; line-height:1.1; }
    section { padding:92px 0; }
    .split { display:grid; grid-template-columns:.82fr 1.18fr; gap:95px; }
    h2 { margin:0; font-size:clamp(2.1rem,4vw,4.1rem); line-height:1; letter-spacing:-.05em; }
    .lead { margin:0; font-size:1.22rem; line-height:1.65; }
    .services { background:#e9efed; }
    .service-grid { margin-top:43px; display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid #b8c6c4; border-left:1px solid #b8c6c4; }
